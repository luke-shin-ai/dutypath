[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dutypath"
version = "0.1.0"
description = "Origin and duty verdicts for one shipment, computed on a public rule snapshot"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["relate-db>=1.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
extract = ["pypdf>=6.0"]

[project.scripts]
dutypath = "dutypath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
